<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AGRINHO PARANA 2026</title>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="paranásustlogo.png" class="logoimg">
        </div>
    </header>
    <section id="acessibilidade" class="acessibilidade">
        <button id="btn-acessibilidade">Acessibilidade</button>
        <div id="botoes-acessibilidade" class="botoes-acessibilidade" style="display: none;">
            <button id="btn-aumentar">Aumentar Fonte</button>
            <button id="btn-diminuir">Diminuir Fonte</button>
            <button id="btn-mudar-cor">Mudar Cor do Texto</button>
        </div>
    </section>
    <main>
        <div class="login">
            <h5 class="titulo">Insira seu nome</h5>
            <input type="text" class="camponome">
            <button class="botao" id="entrar">Entrar!</button>
        </div>
        <div id="tela-loading" class="login escondido">
            <h5 class="titulo">Bem-vindo, <span id="nome-carregamento"></span>!</h5>
            <p>Carregando o sistema...</p>
            <div class="spinner"></div> </div>
    </div>
    </main>
        <script src="script.js" defer></script>
</body>
</html>
